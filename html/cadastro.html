<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Cadastro de voluntários da ONG Esperança."
    >

    <title>ONG Esperança - Cadastro</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="cabecalho">

    <div class="container">

        <h1>ONG Esperança</h1>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>

    </div>

</header>

<main class="container secao">

    <span class="badge info">
        Voluntariado
    </span>

    <h2>Cadastro de voluntário</h2>

    <p>
        Preencha os dados abaixo para participar das ações
        da ONG Esperança.
    </p>

    <form
        id="formCadastro"
        class="formulario"
        novalidate
    >

        <div class="campo">

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                autocomplete="name"
                required
            >

            <small id="erroNome"></small>

        </div>

        <div class="campo">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <small id="erroEmail"></small>

        </div>

        <div class="campo">

            <label for="cpf">
                CPF
            </label>

            <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                inputmode="numeric"
                required
            >

            <small id="erroCpf"></small>

        </div>

        <div class="campo">

            <label for="telefone">
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                autocomplete="tel"
                inputmode="tel"
                required
            >

            <small id="erroTelefone"></small>

        </div>

        <div class="campo">

            <label for="cep">
                CEP
            </label>

            <input
                type="text"
                id="cep"
                name="cep"
                placeholder="00000-000"
                inputmode="numeric"
                required
            >

            <small id="erroCep"></small>

        </div>

        <div class="campo">

            <label for="cidade">
                Cidade
            </label>

            <input
                type="text"
                id="cidade"
                name="cidade"
                autocomplete="address-level2"
                required
            >

            <small id="erroCidade"></small>

        </div>

        <div class="campo">

            <label for="endereco">
                Endereço
            </label>

            <input
                type="text"
                id="endereco"
                name="endereco"
                autocomplete="street-address"
                required
            >

            <small id="erroEndereco"></small>

        </div>

        <div class="acoes">

            <button
                type="submit"
                class="botao"
            >
                Cadastrar
            </button>

            <button
                type="reset"
                class="botao secundario"
            >
                Limpar
            </button>

        </div>

        <div
            id="feedbackFormulario"
            class="alerta"
            role="alert"
            aria-live="polite"
        ></div>

    </form>

</main>

<div
    id="modal"
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="tituloModal"
    hidden
>

    <div class="modal-conteudo">

        <button
            id="fecharModal"
            class="fechar"
            type="button"
            aria-label="Fechar janela"
        >
            &times;
        </button>

        <h2 id="tituloModal">
            Cadastro realizado!
        </h2>

        <p>
            Seus dados foram validados e armazenados
            neste navegador.
        </p>

        <button
            id="okModal"
            class="botao"
            type="button"
        >
            Continuar
        </button>

    </div>

</div>

<footer class="rodape">

    <p>
        &copy; 2026 ONG Esperança. Projeto acadêmico.
    </p>

</footer>

<script src="../js/script.js"></script>

</body>

</html>
